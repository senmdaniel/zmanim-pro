<!DOCTYPE html>
<html>
<head>
  <title>Zmanim Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-light">

<div class="container py-5">

  <h1 class="mb-4">🕍 Zmanim Dashboard</h1>

  <div class="row g-3" id="cards">

    <div class="col-md-3">
      <div class="card bg-secondary text-white">
        <div class="card-body">
          <h5>Sunrise</h5>
          <h3 id="sunrise">-</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card bg-secondary text-white">
        <div class="card-body">
          <h5>Shkia</h5>
          <h3 id="shkia">-</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card bg-warning text-dark">
        <div class="card-body">
          <h5>Candle Lighting</h5>
          <h3 id="candle">-</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card bg-info text-dark">
        <div class="card-body">
          <h5>Tzeit</h5>
          <h3 id="tzeit">-</h3>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
async function loadZmanim() {
  const res = await fetch('/zmanim');
  const data = await res.json();

  document.getElementById("sunrise").innerText = data.sunrise;
  document.getElementById("shkia").innerText = data.shkia;
  document.getElementById("candle").innerText = data.candle_lighting;
  document.getElementById("tzeit").innerText = data.tzeit;
}

loadZmanim();
setInterval(loadZmanim, 60000); // elke minuut refresh
</script>

</body>
</html>
